<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>漢字 | 日本語クラス</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between;margin-bottom:10px">
    <h1 style="margin:0">漢字 <span class="pill" id="cnt"></span></h1>
    <div class="row noprint">
      <a class="tab" href="kana.html?s=hira">ひらがな</a><a class="tab" href="kana.html?s=kata">カタカナ</a><a class="tab on" href="kanji.html">漢字</a>
    </div>
  </div>
  <div class="row noprint" style="margin-bottom:10px">
    <button class="tab lv" data-l="5">N5 (113字)</button><button class="tab lv" data-l="4">N4 (209字)</button><button class="tab lv" data-l="3">N3 (197字)</button>
    <span style="width:16px"></span>
    <button class="tab on" data-t="list">一覧・カード</button><button class="tab" data-t="quiz">クイズ</button><button class="tab" data-t="oral">質問カード(口頭)</button>
  </div>
  <div class="row noprint" id="groups" style="margin-bottom:12px"></div>

  <div id="tList">
    <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(320px,1.1fr);align-items:start">
      <section class="card"><div class="kgrid" id="kgrid"></div></section>
      <section class="card" id="detail"><div class="sub">左の漢字をクリックしてください。</div></section>
    </div>
  </div>

  <div id="tQuiz" style="display:none">
    <section class="card" id="qset">
      <h2>クイズの設定</h2>
      <div class="row">
        <div><label>しゅるい</label><select id="qmode">
          <option value="k2m">かんじ → いみ</option><option value="m2k">いみ → かんじ</option>
          <option value="w2r">ことば → よみかた</option><option value="p2k">え → かんじ</option><option value="r2w">よみかた → ことば</option></select></div>
        <div><label>はんい</label><select id="qscope"></select></div>
        <div><label>もんだいの かず</label><select id="qn"><option>10</option><option>20</option><option>5</option></select></div>
      </div>
      <div class="row" style="margin-top:14px"><button class="btn-primary" id="qgo" style="font-size:18px;padding:10px 26px">▶ はじめる</button></div>
    </section>
    <div id="qarea" style="display:none"></div>
  </div>

  <div id="tOral" style="display:none">
    <section class="card noprint" style="margin-bottom:12px">
      <div class="row"><label style="margin:0">しゅるい</label>
        <select id="omode" style="width:auto"><option value="meaning">この かんじの いみは?</option><option value="reading">この かんじの よみかたは?</option><option value="write">この いみの かんじを かいてください</option><option value="word">この かんじを つかった ことばは?</option><option value="wread">この ことばを よんでください</option></select>
        <label style="margin:0">はんい</label><select id="oscope" style="width:auto"></select><button class="btn-primary" id="ogo">▶ カードを出す</button></div>
    </section>
    <div id="oarea"></div>
  </div>
  <p class="sub" style="margin-top:20px;font-size:13px">漢字リスト: Langoal「JLPT N5・N4・N3」／イラスト: Twemoji © Twitter, Inc. and other contributors — CC BY 4.0</p>
</main>
<script src="data/index.js"></script><script src="data/kanji.js"></script>
<script src="js/app.js?v=20261125"></script><script src="js/pad.js"></script><script src="js/quiz.js"></script>
<script>
renderHeader('', '');
const $ = id=>document.getElementById(id);
let LV = store.get('kanjiLv','5'), GRP = '', pad = null, curK = null;
function items(){ return KANJI[LV].items.filter(k=>!GRP||k.g===GRP); }
function setLevel(l){ LV=l; GRP=''; store.set('kanjiLv',l); document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('on',b.dataset.l===l)); drawGroups(); drawGrid(); fillScopes(); }
function drawGroups(){
  $('groups').innerHTML = '<button class="chip on" data-g="">ぜんぶ</button>'+KANJI[LV].groups.map(g=>'<button class="chip" data-g="'+esc(g)+'">'+esc(g)+' ('+KANJI[LV].items.filter(k=>k.g===g).length+')</button>').join('');
  document.querySelectorAll('#groups .chip').forEach(b=>b.onclick=()=>{ GRP=b.dataset.g; document.querySelectorAll('#groups .chip').forEach(x=>x.classList.toggle('on',x===b)); drawGrid(); });
}
function drawGrid(){
  const it = items(); $('cnt').textContent = 'N'+LV+' · '+it.length+'字';
  $('kgrid').innerHTML = it.map(k=>'<button class="kc" data-n="'+k.no+'">'+esc(k.k)+'<small>'+esc(k.m.split(/[;,]/)[0])+'</small></button>').join('');
  document.querySelectorAll('#kgrid .kc').forEach(b=>b.onclick=()=>show(+b.dataset.n));
}
function show(no){
  const k = KANJI[LV].items.find(x=>x.no===no); if(!k) return; curK = k;
  document.querySelectorAll('#kgrid .kc').forEach(b=>b.classList.toggle('on',+b.dataset.n===no));
  const list = items(), i = list.findIndex(x=>x.no===no);
  $('detail').innerHTML = '<div class="row" style="justify-content:space-between"><span class="pill">'+esc(k.g)+' · No.'+k.no+'</span><div class="row"><button id="kp">◀</button><button id="kn">▶</button></div></div>'+
    '<div class="row" style="align-items:center;margin-top:6px"><div class="bigch" style="font-size:130px">'+esc(k.k)+'</div><img class="kpic" src="kanji/N'+LV+'/'+k.p+'" alt=""><div><div style="font-size:26px;font-weight:700">'+esc(k.m)+'</div><div class="sub" style="margin:0">'+k.st+'画</div></div></div>'+
    '<table style="margin:8px 0;font-size:20px"><tr><td class="sub" style="padding-right:12px">音読み</td><td>'+esc(k.on)+'</td></tr><tr><td class="sub">訓読み</td><td>'+esc(k.kun)+'</td></tr></table>'+
    '<h3>ことば</h3>'+k.w.map(w=>'<div class="wd"><span>'+esc(w[0])+'</span><span style="font-size:18px">'+esc(w[1])+'</span><button class="small-btn" data-sp="'+esc(w[1])+'">🔊</button><span class="m">'+esc(w[2])+'</span></div>').join('')+
    '<div style="margin-top:12px"><h3>かいて みよう</h3><div id="padbox"></div></div>';
  document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>speak(b.dataset.sp));
  $('kp').onclick=()=>{ if(i>0) show(list[i-1].no); }; $('kn').onclick=()=>{ if(i<list.length-1) show(list[i+1].no); };
  pad = WritePad($('padbox'), 280); pad.set(k.k);
}
document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>setLevel(b.dataset.l));
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));
  $('tList').style.display=b.dataset.t==='list'?'block':'none'; $('tQuiz').style.display=b.dataset.t==='quiz'?'block':'none'; $('tOral').style.display=b.dataset.t==='oral'?'block':'none';
  $('groups').style.display = b.dataset.t==='list'?'flex':'none';
});
function fillScopes(){
  const opts = '<option value="">N'+LV+' ぜんぶ</option>'+KANJI[LV].groups.map(g=>'<option>'+esc(g)+'</option>').join('');
  $('qscope').innerHTML = opts; $('oscope').innerHTML = opts;
}
/* ---- クイズ ---- */
const first = s=>s.split(/[;,]/)[0].trim();
function pool(scope){ return KANJI[LV].items.filter(k=>!scope||k.g===scope); }
function build(mode, scope, n){
  const P = pool(scope), ALL = KANJI[LV].items, qs = [];
  if(mode==='k2m') Quiz.pick(P,n).forEach(k=>qs.push({p:esc(k.k),a:first(k.m),o:[first(k.m)].concat(Quiz.distract(first(k.m),ALL.map(x=>first(x.m)),3)),x:esc(k.on+' / '+k.kun)}));
  if(mode==='m2k') Quiz.pick(P,n).forEach(k=>qs.push({p:'<span style="font-size:42px">'+esc(first(k.m))+'</span>',a:k.k,o:[k.k].concat(Quiz.distract(k.k,P.length>=6?P.map(x=>x.k):ALL.map(x=>x.k),3))}));
  if(mode==='p2k') Quiz.pick(P,n).forEach(k=>qs.push({p:'<img class="kpic" style="width:150px;height:150px" src="kanji/N'+LV+'/'+k.p+'">',a:k.k,o:[k.k].concat(Quiz.distract(k.k,P.length>=6?P.map(x=>x.k):ALL.map(x=>x.k),3)),x:esc(first(k.m))}));
  const words = P.flatMap(k=>k.w.map(w=>({w:w[0],r:w[1],m:w[2],k:k.k}))).filter(w=>/[一-龥]/.test(w.w) && w.w!==w.r);
  const allw = ALL.flatMap(k=>k.w.map(w=>({w:w[0],r:w[1],m:w[2]}))).filter(w=>/[一-龥]/.test(w.w) && w.w!==w.r);
  if(mode==='w2r') Quiz.pick(words,n).forEach(w=>qs.push({p:esc(w.w),a:w.r,speak:w.r,o:[w.r].concat(Quiz.distract(w.r,allw.map(x=>x.r),3)),x:esc(w.m)}));
  if(mode==='r2w') Quiz.pick(words,n).forEach(w=>qs.push({p:esc(w.r)+'<div class="mid" style="color:var(--muted)">'+esc(w.m)+'</div>',a:w.w,speak:w.r,o:[w.w].concat(Quiz.distract(w.w,allw.map(x=>x.w),3))}));
  return qs;
}
function startQuiz(){
  const qs = build($('qmode').value, $('qscope').value, parseInt($('qn').value));
  if(qs.length<4){ toast('この はんいでは もんだいが すくないです'); return; }
  $('qset').style.display='none'; $('qarea').style.display='block';
  Quiz.run($('qarea'), qs, a=>{ if(a==='again') startQuiz(); else { $('qarea').style.display='none'; $('qset').style.display='block'; } });
}
$('qgo').onclick = startQuiz;
/* ---- 口頭 ---- */
$('ogo').onclick = ()=>{
  const mode=$('omode').value, P=pool($('oscope').value);
  const src = mode==='wread' ? Quiz.pick(P.flatMap(k=>k.w.map(w=>({k,w}))),10) : Quiz.pick(P,10).map(k=>({k}));
  const cards = src.map(o=>{ const k=o.k;
    if(mode==='meaning') return {t:'この かんじの いみは?', p:esc(k.k), a:esc(k.m)+'<br><small>'+esc(k.on)+' / '+esc(k.kun)+'</small>', speak:(k.kun.split('・')[0]||'').replace(/[()（）―]/g,'')};
    if(mode==='reading') return {t:'この かんじの よみかたは?', p:esc(k.k), a:'音: '+esc(k.on)+'　訓: '+esc(k.kun), speak:k.w[0]?k.w[0][1]:''};
    if(mode==='write') return {t:'この いみの かんじを かいてください', p:'<span style="font-size:44px">'+esc(first(k.m))+'</span>', a:esc(k.k)+'　('+k.st+'画)'};
    if(mode==='word') return {t:'この かんじを つかった ことばを いってください', p:esc(k.k), a:k.w.map(w=>esc(w[0])+'('+esc(w[1])+')').join(' / '), speak:k.w[0]?k.w[0][1]:''};
    return {t:'この ことばを よんでください', p:esc(o.w[0]), a:esc(o.w[1])+' — '+esc(o.w[2]), speak:o.w[1]};
  });
  Quiz.cards($('oarea'), cards);
};
setLevel(LV);
</script>
</body>
</html>
