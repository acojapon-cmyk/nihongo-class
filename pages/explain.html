<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>説明資料 | 日本語クラス</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main>
  <h1>説明資料</h1>
  <p class="sub" style="margin-bottom:6px">▶ <a href="cando.html" style="color:var(--blue);font-weight:700">Can-do説明資料(課別Can-doスライド・対応表)はこちら</a></p>
  <p class="sub">文型カードを1枚ずつ大きく表示します。Zoomなどの画面共有でそのまま使えます。漢字は <code>漢字{かんじ}</code> の形で書くとふりがなが付きます。</p>

  <div class="card noprint" style="margin-bottom:16px">
    <div class="row">
      <button id="prev">◀ 前</button>
      <span id="pos" class="pill">0 / 0</span>
      <button id="next" class="btn-primary">次 ▶</button>
      <button id="toggleRuby">ふりがな ON/OFF</button>
      <button id="toggleSize">文字を大きく</button>
      <button id="toggleEdit" style="margin-left:auto">✏ 編集</button>
    </div>
  </div>

  <div class="stage" id="stage"></div>

  <div id="editor" class="card noprint" style="display:none;margin-top:16px">
    <h2>カードを編集</h2>
    <label>見出し(文型)</label><input id="eTitle">
    <label>例文(1行に1文)</label><textarea id="eExamples"></textarea>
    <label>ポイント・説明(生徒の母語・英語での補足もOK)</label><textarea id="eNote"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn-primary" id="eSave">保存</button>
      <button id="eNew">新しいカードを追加</button>
      <button id="eDel">このカードを削除</button>
    </div>
  </div>
</main>
<script src="../js/app.js?v=20261125"></script>
<script>
renderHeader('pages/explain.html','../');
// サンプルは教材の引用ではなく、使い方を示す独自の例です。
let cards = loadList('explain', [
  {title:'AはBです', examples:['わたしは 先生{せんせい}です。','ラビさんは 学生{がくせい}です。'], note:'A is B. ポイント: 「は」は話題を示す。'},
  {title:'AはBじゃありません', examples:['わたしは 学生{がくせい}じゃありません。'], note:'否定形。丁寧に言うときは「ではありません」。'}
]);
let i = 0, edit = false;
const $ = id => document.getElementById(id);
function show(){
  if(!cards.length){ $('stage').innerHTML = '<div class="mid">カードがありません。「✏ 編集」から追加してください。</div>'; $('pos').textContent='0 / 0'; return; }
  i = Math.min(Math.max(i,0), cards.length-1);
  const c = cards[i];
  $('stage').innerHTML = '<div class="big">'+ruby(c.title)+'</div>' +
    c.examples.map(e=>'<div class="mid">'+ruby(e)+'</div>').join('') +
    (c.note ? '<div class="small">'+esc(c.note)+'</div>' : '');
  $('pos').textContent = (i+1)+' / '+cards.length;
  $('eTitle').value = c.title; $('eExamples').value = c.examples.join('\n'); $('eNote').value = c.note||'';
}
$('prev').onclick = ()=>{ i--; show(); };
$('next').onclick = ()=>{ i++; show(); };
document.addEventListener('keydown', e=>{ if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return; if(e.key==='ArrowRight'){i++;show();} if(e.key==='ArrowLeft'){i--;show();} });
$('toggleRuby').onclick = ()=>document.body.classList.toggle('hide-ruby');
$('toggleSize').onclick = ()=>document.body.classList.toggle('big-on');
$('toggleEdit').onclick = ()=>{ edit=!edit; $('editor').style.display = edit?'block':'none'; };
$('eSave').onclick = ()=>{ if(!cards.length) return; cards[i] = {title:$('eTitle').value, examples:$('eExamples').value.split('\n').filter(Boolean), note:$('eNote').value}; store.set('explain',cards); show(); toast('保存しました'); };
$('eNew').onclick = ()=>{ cards.push({title:'新しい文型', examples:['例文'], note:''}); i = cards.length-1; store.set('explain',cards); show(); edit=true; $('editor').style.display='block'; };
$('eDel').onclick = ()=>{ if(!cards.length||!confirm('削除しますか?')) return; cards.splice(i,1); store.set('explain',cards); show(); };
show();
</script>
</body>
</html>
