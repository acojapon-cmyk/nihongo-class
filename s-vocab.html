<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ことば カード</title><link rel="stylesheet" href="css/style.css?v=20261126">
<style>.stage{cursor:pointer;min-height:220px;user-select:none}.stage .big{font-size:44px}.stage .mid{font-size:26px;color:var(--blue)}.bar2{height:8px;background:#eee;border-radius:4px;margin:10px 0}.bar2 i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .2s}</style>
</head><body>
<main style="max-width:760px">
  <h1 style="margin:0 0 8px">ことば カード <span class="pill">Word cards</span></h1>
  <div class="row" style="margin-bottom:8px"><select id="lsel" style="flex:1 1 100%"></select><select id="mode" style="flex:1 1 100%"><option value="wm">ことば → いみ / word → meaning</option><option value="mw">いみ → ことば</option></select></div>
  <div class="row"><span class="pill" id="pos"></span><span class="pill" style="background:#eef6ec;color:var(--green)" id="score"></span><button id="shuf">🔀 シャッフル</button><button id="restart">↺ はじめから</button></div>
  <div class="bar2"><i id="prog" style="width:0"></i></div>
  <div class="stage card" id="stage"></div>
  <div class="row" style="margin-top:12px;justify-content:center">
    <button id="prev">◀</button><button id="spk">🔊</button><button id="flip" class="btn-primary">めくる / Flip</button><button id="next">▶</button>
  </div>
  <div class="row" style="margin-top:10px;justify-content:center"><button id="ok" style="color:var(--green)">○ いえた / Got it</button><button id="ng" style="color:var(--accent)">× もういちど / Again</button></div>
</main>
<script src="data/index.js"></script><script src="js/app.js?v=20261126"></script><script src="js/student.js"></script>
<script>
S.header('ことば カード');
let cards=[],i=0,shown=false,ok=0,total=0,N=S.cur();
function load(n){ N=n; loadLesson(n,L=>{ const seen=new Set(); cards=(L&&L.vocab||[]).filter(v=>v.w&&v.m&&!seen.has(v.w)&&seen.add(v.w)); total=cards.length; i=0;ok=0;shown=false; draw(); }); }
function draw(){
  const st=S.$('stage');
  if(!cards.length){ st.innerHTML='<div class="mid">この課には ことばカードが ありません。</div>'; S.$('pos').textContent=''; return; }
  if(i>=cards.length) i=0;
  const c=cards[i], rev=S.$('mode').value==='mw';
  const front=rev?c.m:c.w, back=rev?c.w:c.m;
  st.innerHTML='<div class="big">'+ruby(front)+'</div>'+(shown?'<div class="mid">'+ruby(back)+'</div>':'<div class="small" style="color:var(--muted)">タップして こたえを みる / Tap to see</div>');
  S.$('pos').textContent=(i+1)+' / '+cards.length; S.$('score').textContent='○ '+ok+' / '+total;
  S.$('prog').style.width=(total?ok/total*100:0)+'%';
}
function next(){ i=(i+1)%Math.max(1,cards.length); shown=false; draw(); }
S.$('stage').onclick=S.$('flip').onclick=()=>{ shown=!shown; draw(); };
S.$('next').onclick=next; S.$('prev').onclick=()=>{ i=(i-1+cards.length)%Math.max(1,cards.length); shown=false; draw(); };
S.$('spk').onclick=()=>{ if(cards[i]) S.speak(cards[i].w); };
S.$('ok').onclick=()=>{ if(!cards.length) return; cards.splice(i,1); ok++; if(!cards.length){ S.$('stage').innerHTML='<div class="big">おつかれさま!</div><div class="mid">ぜんぶ いえました / All done 🎉</div>'; S.$('prog').style.width='100%'; S.$('pos').textContent=''; S.$('score').textContent='○ '+ok+' / '+total; return; } if(i>=cards.length) i=0; shown=false; draw(); };
S.$('ng').onclick=()=>{ if(!cards.length) return; const c=cards.splice(i,1)[0]; cards.push(c); if(i>=cards.length) i=0; shown=false; draw(); };
S.$('shuf').onclick=()=>{ cards=S.shuffle(cards); i=0; draw(); };
S.$('restart').onclick=()=>load(N);
S.$('mode').onchange=()=>{ shown=false; draw(); };
S.select(S.$('lsel'),N,load); load(N);
</script></body></html>
