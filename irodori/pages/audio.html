<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音声 | 日本語クラス（いろどり）</title>
<link rel="stylesheet" href="../css/style.css?v=20261126">
</head>
<body>
<main>
  <h1>音声 <span class="pill">Audio</span></h1>
  <p class="sub">本冊『いろどり』入門の音声を、課・活動ごとに再生します。「📖 p.◯」を押すと、本冊PDFのそのページが開きます。</p>
  <section class="card">
    <div class="row"><label style="margin:0">課</label><select id="lsel" style="width:auto"></select><a id="toLesson" class="btn" style="padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:#fff">授業コンソールへ</a><a href="book.html" class="btn" style="padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:#fff">📖 本冊の一覧</a></div>
    <div id="box" style="margin-top:10px"></div>
  </section>
</main>
<script src="../data/index.js?v=5"></script>
<script src="../data/audio.js?v=5"></script>
<script src="../js/app.js?v=20261126"></script>
<script src="../js/audio.js?v=5"></script>
<script>
renderHeader('pages/audio.html','../');
const $ = id=>document.getElementById(id);
const q = new URLSearchParams(location.search);
let N = q.get('n')!==null ? parseInt(q.get('n')) : (parseInt(localStorage.getItem('ir:lastLesson')||'1')||1);
function show(){ AudioPanel.render($('box'), N, '../'); $('toLesson').href = N? '../lesson.html?n='+N : '../index.html'; localStorage.setItem('ir:audioLesson',N); }
$('lsel').innerHTML = '<option value="0">前付・教室のことば(第0課)</option>'+LESSON_INDEX.map(l=>'<option value="'+l.n+'">'+esc(l.label)+' '+esc(l.title)+'</option>').join('');
$('lsel').value = String(N);
$('lsel').onchange = ()=>{ N=+$('lsel').value; show(); };
show();
</script>
</body>
</html>
