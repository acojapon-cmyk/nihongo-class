<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生徒画面 | 日本語クラス（いろどり）</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#img{max-width:100vw;max-height:100vh;width:auto;height:auto;aspect-ratio:16/9;object-fit:contain;background:#fff}
#blank{position:fixed;inset:0;background:#000;display:none;color:#555;align-items:center;justify-content:center;font-size:22px}
#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 18px;border-radius:999px;font-size:14px;transition:opacity .6s}
</style>
</head>
<body>
<div id="wrap"><img id="img" alt=""></div>
<div id="bookwrap" style="display:none;position:fixed;inset:0;background:#fff;z-index:5"></div>
<div id="blank">画面を休ませています</div>
<div id="ver" style="position:fixed;right:10px;bottom:6px;color:#888;font-size:12px;z-index:9">v5</div>
<div id="hint">(v5) このウィンドウを画面共有してください ／ F: 全画面 ／ ←→: スライド ／ B: 黒画面</div>
<script src="data/index.js?v=5"></script>
<script>
const q = new URLSearchParams(location.search);
const N = parseInt(q.get('n')) || 1;
const lesson = (window.LESSON_INDEX||[]).find(l=>l.n===N) || {count:0};
let i = 1, blank = false;
const img = document.getElementById('img');
const ch = ('BroadcastChannel' in window) ? new BroadcastChannel('ir-present') : null;
const pad = n => String(n).padStart(2,'0');
const src = n => 'slides/L'+pad(N)+'/s-'+pad(n)+'.jpg';
function show(){
  i = Math.min(Math.max(i,1), lesson.count);
  img.src = src(i);
  document.getElementById('blank').style.display = blank ? 'flex' : 'none';
  [i+1,i+2].forEach(k=>{ if(k<=lesson.count){ const p = new Image(); p.src = src(k); } });
}
function send(msg){ msg.n = N; if(ch) ch.postMessage(msg); try{ localStorage.setItem('ir:sync', JSON.stringify(Object.assign({t:Date.now()},msg))); }catch(e){} }
function showBook(seg,page){ const w=document.getElementById('bookwrap'); w.innerHTML=''; const f=document.createElement('iframe'); f.style.cssText='width:100%;height:100%;border:0;background:#fff'; f.src='book/book_'+seg+'.pdf#page='+page+'&view=FitV&toolbar=0&navpanes=0&scrollbar=0'; w.appendChild(f); w.style.display='block'; }
const PRES_VER=5;
function ack(){ const a={type:'bookack',v:PRES_VER}; try{ if(window.opener) window.opener.postMessage(a,'*'); }catch(e){} try{ if(ch) ch.postMessage(a); localStorage.setItem('ir:bookack', JSON.stringify({t:Date.now()})); }catch(e){} }
function hideBook(){ const w=document.getElementById('bookwrap'); w.style.display='none'; w.innerHTML=''; }
function apply(m){ if(m && m.type==='book'){ showBook(m.seg,m.page); ack(); return; } if(m && m.type==='bookoff'){ hideBook(); return; } if(!m || m.n!==N) return; if(m.type==='go') hideBook(); if(m.type==='go'){ i=m.i; blank=!!m.blank; show(); } if(m.type==='hello'){ } }
if(ch) ch.onmessage = e => apply(e.data);
window.addEventListener('message', e => { if(e.data && typeof e.data==='object') apply(e.data); });
window.addEventListener('storage', e => { if(e.key==='ir:booksync'){ try{ apply(JSON.parse(e.newValue)); }catch(_){} } if(e.key==='ir:sync'){ try{ apply(JSON.parse(e.newValue)); }catch(_){} } });
function go(d){ i += d; show(); send({type:'go', i, blank}); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); go(1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ go(-1); }
  else if(e.key==='b'||e.key==='B'){ blank=!blank; show(); send({type:'go', i, blank}); }
  else if(e.key==='f'||e.key==='F'){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
});
img.onclick = () => go(1);
// 開いたとき、先生コンソールに現在位置を尋ねる
const saved = parseInt(localStorage.getItem('ir:pos:'+N)||'1'); i = saved||1; if(lesson.count) show();
send({type:'hello'});
setTimeout(()=>document.getElementById('hint').style.opacity=0, 6000);
</script>
</body>
</html>
